# Legacy Forge (1.12.2) historically runs on Java 8, but the root MixinKt
# library is compiled to Java 21. We match the root toolchain here so the
# build configures; shipping a real 1.12.2 artifact would additionally need
# Jabel (or a Java 8 build of the root) so the bytecode is JDK 8 loadable.
javaVersion=21
forgeLegacyVersion=1.12.2-14.23.5.2860
